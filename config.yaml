pipeline:
  name: "Student Data Integration Pipeline"
  version: "1.0.0"

paths:
  csv_raw: "data/raw/students.csv"
  database_path: "database/students.db"
  processed_output: "data/processed/final_dataset.csv"
  rejected_output: "data/rejected/rejected_records.csv"
  log_file: "logs/pipeline.log"
  state_file: "logs/pipeline_state.json"

api:
  base_url: "http://127.0.0.1:8000/api/students"
  timeout_seconds: 5
  mock_data_fallback: "data/raw/students_api.json"
  auto_start_mock: true
mongodb:
  enabled: true
  uri_env: MONGO_URI           
  database_env: MONGO_DB       
  collection: students
  output_collection: final_students
  query_filter: {}
  mock_data_fallback: data/raw/students_mongodb.json
  auto_fallback: true
web_scraper:
    enabled: true           
    on_failure: "skip"
    schema_mode: "lenient"
    url: "https://example.com/students"
    row_selector: "table.students tbody tr"
    column_mapping:
      student_id:
        selector: "td.id"
        extract: "text"
        default: null
      academic_honors:
        selector: "td.honors"
        extract: "text"
        default: "None"
      graduation_year:
        selector: "td.grad_year"
        extract: "text"
        default: null
url_source:
    enabled: true           
    on_failure: "skip"
    schema_mode: "lenient"
    url: "https://example.com/data"
    type: "auto"
    output_raw: "data/raw/url_data.json"
validation:
  age_min: 16
  age_max: 80
  gpa_min: 0.0
  gpa_max: 4.0
  attendance_min: 0.0
  attendance_max: 100.0
  score_min: 0.0
  score_max: 100.0

imputation:
  gpa_strategy: "median"
  attendance_strategy: "median"
  score_strategy: "mean"

